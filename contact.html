<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2b1725">
  <meta name="description" content="Contact RAW Creatives — From concept to creation.">
  <title>Contact | RAW Creatives</title>
  <style>
    :root {
      --cream: #fff8ef;
      --cream-deep: #f5e5d7;
      --terracotta: #e4512b;
      --terracotta-dark: #b93a20;
      --plum: #2b1725;
      --plum-soft: #412637;
      --muted: #74656c;
      --white: #fff;
      --max-width: 1160px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: var(--plum);
      background: var(--cream);
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }
    .container { width: min(var(--max-width), calc(100% - 48px)); margin-inline: auto; }

    .topbar {
      position: relative;
      z-index: 2;
      background: rgba(255,248,239,.94);
      border-bottom: 1px solid rgba(43,23,37,.09);
      backdrop-filter: blur(14px);
    }
    .topbar-inner {
      min-height: 84px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .brand { display: inline-flex; align-items: center; }
    .brand img { width: 190px; max-height: 60px; object-fit: contain; object-position: left center; }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: .9rem;
      font-weight: 750;
      color: var(--plum);
      transition: color .25s ease, transform .25s ease;
    }
    .back-link:hover { color: var(--terracotta); transform: translateX(-3px); }

    main { flex: 1; display: flex; align-items: stretch; }
    .contact-hero {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      display: grid;
      align-items: center;
      width: 100%;
      min-height: min(760px, calc(100vh - 150px));
      padding: clamp(70px, 10vw, 130px) 0;
      background: var(--plum);
      color: var(--white);
    }
    .contact-hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(105deg, rgba(43,23,37,.95) 0%, rgba(43,23,37,.83) 48%, rgba(43,23,37,.55) 100%),
        url("images/images/Teamraw.png") center 45% / cover no-repeat;
      transform: scale(1.04);
      animation: background-arrive 1.2s ease-out both;
    }
    .contact-hero::after {
      content: "";
      position: absolute;
      z-index: -1;
      width: min(48vw, 600px);
      aspect-ratio: 1;
      right: -10%;
      top: -28%;
      border: 1px solid rgba(255,179,107,.28);
      border-radius: 50%;
      box-shadow: 0 0 0 55px rgba(255,179,107,.035), 0 0 0 110px rgba(255,179,107,.025);
      pointer-events: none;
    }
    .contact-content { max-width: 850px; position: relative; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: #ffb36b;
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .19em;
      text-transform: uppercase;
      animation: rise-in .7s .1s both;
    }
    .eyebrow::before { content: ""; width: 28px; height: 2px; background: #ffb36b; }
    h1 {
      max-width: 800px;
      margin: 20px 0 18px;
      font-size: clamp(3.1rem, 8vw, 6.8rem);
      line-height: .98;
      letter-spacing: -.065em;
      font-weight: 850;
      animation: rise-in .8s .2s both;
    }
    h1 span { color: #ffb36b; }
    .intro {
      max-width: 540px;
      margin: 0 0 44px;
      color: rgba(255,255,255,.8);
      font-size: clamp(1rem, 1.6vw, 1.13rem);
      animation: rise-in .8s .3s both;
    }
    .contact-details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      max-width: 760px;
      animation: rise-in .8s .4s both;
    }
    .contact-card {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 17px;
      padding: 24px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 16px;
      background: rgba(255,255,255,.09);
      backdrop-filter: blur(12px);
      transition: transform .3s ease, background .3s ease, border-color .3s ease;
    }
    .contact-card:hover {
      transform: translateY(-6px);
      background: rgba(255,255,255,.15);
      border-color: rgba(255,179,107,.7);
    }
    .contact-icon {
      flex: 0 0 48px;
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      color: var(--plum);
      background: #ffb36b;
    }
    .contact-icon svg { width: 22px; height: 22px; }
    .contact-label {
      display: block;
      margin-bottom: 4px;
      color: rgba(255,255,255,.65);
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .contact-value {
      display: block;
      overflow-wrap: anywhere;
      color: var(--white);
      font-size: clamp(.95rem, 1.6vw, 1.1rem);
      font-weight: 700;
    }
    .contact-card a:hover .contact-value { color: #ffcf9e; }
    .contact-note {
      margin: 28px 0 0;
      color: rgba(255,255,255,.64);
      font-size: .85rem;
      animation: rise-in .8s .5s both;
    }

    footer {
      padding: 22px 0;
      color: rgba(255,255,255,.72);
      background: #21121d;
      text-align: center;
    }
    .copyright { margin: 0; font-size: .8rem; letter-spacing: .025em; }
    .copyright strong { color: #ffb36b; font-weight: 700; }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(22px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes background-arrive {
      from { opacity: .5; transform: scale(1.1); }
      to { opacity: 1; transform: scale(1.04); }
    }
    @media (max-width: 640px) {
      .container { width: min(100% - 32px, var(--max-width)); }
      .topbar-inner { min-height: 72px; }
      .brand img { width: 150px; max-height: 48px; }
      .contact-hero { min-height: auto; padding: 78px 0 84px; }
      .contact-hero::before {
        background:
          linear-gradient(105deg, rgba(43,23,37,.94), rgba(43,23,37,.82)),
          url("images/images/Teamraw.png") center / cover no-repeat;
      }
      h1 { font-size: clamp(3rem, 14vw, 5rem); }
      .intro { margin-bottom: 32px; }
      .contact-details { grid-template-columns: 1fr; gap: 12px; }
      .contact-card { padding: 19px; }
      .contact-hero::after { width: 85vw; right: -45%; top: -10%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="index.html" aria-label="RAW Creatives home">
        <img src="images/images/Rawlogo.png" alt="RAW Creatives — From Concept to Creation">
      </a>
      <a class="back-link" href="index.html"><span aria-hidden="true">←</span> Back to home</a>
    </div>
  </header>

  <main>
    <section class="contact-hero" aria-labelledby="contact-title">
      <div class="container">
        <div class="contact-content">
          <span class="eyebrow">Let’s make it happen</span>
          <h1 id="contact-title">Good ideas<br>start with <span>a hello.</span></h1>
          <p class="intro">Have a brand, campaign or experience in mind? Get in touch with RAW Creatives.</p>

          <div class="contact-details">
            <a class="contact-card" href="mailto:YOUR_EMAIL@example.com" aria-label="Email RAW Creatives">
              <span class="contact-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                  <path d="m3 7 9 6 9-6"></path>
                </svg>
              </span>
              <span>
                <span class="contact-label">Email us</span>
                <span class="contact-value">YOUR_EMAIL@example.com</span>
              </span>
            </a>

            <a class="contact-card" href="tel:+254700000000" aria-label="Call RAW Creatives">
              <span class="contact-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.8 19.8 0 0 1 11.2 18a19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.09 3.18 2 2 0 0 1 4.08 1h3a2 2 0 0 1 2 1.72c.12.96.35 1.9.68 2.8a2 2 0 0 1-.45 2.11L8.04 8.9a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.33 1.84.56 2.8.68A2 2 0 0 1 22 16.92z"></path>
                </svg>
              </span>
              <span>
                <span class="contact-label">Call us</span>
                <span class="contact-value">+254 700 000 000</span>
              </span>
            </a>

            <!-- Duplicate the contact-card block above if you have another phone number. -->
          </div>
          <p class="contact-note">RAW Creatives · From concept to creation.</p>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p class="copyright">© <span id="year">2026</span> <strong>RAW Creatives.</strong> All rights reserved.</p>
    </div>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
